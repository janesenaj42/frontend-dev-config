# baseline-file sha256:a6c764718f16 (generated by repo-setup; don't edit: re-run repo-setup to update)
# Git hooks every repository gets. Your own commands go in lefthook.yml, which extends this
# file. lefthook lets this file win over lefthook.yml, so repo-setup leaves out a command that
# lefthook.yml already has under the same hook and name: give yours the same name to replace one,
# then re-run repo-setup.
commit-msg:
  commands:
    conventional-commit:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    branch-name:
      run: node .baseline/checks/branch-name.mjs
    packages-init-react-test:
      root: "packages/init-react/"
      glob: "*"
      run: npm run test

pre-commit:
  parallel: true
  commands:
    baseline:
      run: node .baseline/checks/baseline.mjs
    json-valid:
      glob: "*.{json,jsonc}"
      run: node .baseline/checks/json-valid.mjs {staged_files}
    packages-init-react-lint:
      root: "packages/init-react/"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: npx --no -- eslint {staged_files}
    packages-init-react-format:
      root: "packages/init-react/"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,scss,md,html,yml,yaml}"
      run: npx --no -- prettier --ignore-path .gitignore --ignore-path .prettierignore --ignore-path ../../.gitignore --ignore-path ../../.prettierignore --check --ignore-unknown {staged_files}
